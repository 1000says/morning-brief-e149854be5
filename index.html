<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>モーニングブリーフ</title>
<style>
  :root{
    --bg:#FCFCFB; --wash:#F9F9F7; --ink:#2E2C27; --ink-soft:#6B6A63;
    --ink-grey:#B4B3A8; --hairline:#E4E3DC; --clay:#C6613F; --line:#E1E1DF;
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Noto Serif CJK JP",Georgia,serif;
    --sans:-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.7}
  .band{width:100%;}
  .top{background:var(--wash);border-bottom:1px solid var(--line)}
  .bottom{background:var(--bg)}
  .inner{max-width:860px;margin:0 auto;padding:54px 40px}
  .daydate{font-family:var(--sans);font-size:14px;color:var(--ink-soft);letter-spacing:.02em;margin-bottom:14px}
  .headline{font-family:var(--serif);font-size:40px;line-height:1.32;color:var(--ink);font-weight:600;letter-spacing:.01em}
  .drawing{margin:38px 0 6px}
  .drawing svg{display:block;width:100%;height:auto}
  .acts{display:flex;margin-top:14px}
  .act{flex:1;padding:0 22px}
  .act:first-child{padding-left:0}
  .act:last-child{padding-right:0}
  .act + .act{border-left:1px solid var(--hairline)}
  .act .time{font-weight:700;font-size:14px;color:var(--ink);letter-spacing:.03em;margin-bottom:8px}
  .act .desc{font-size:14.5px;color:var(--ink-soft);line-height:1.72}
  .calm{font-size:17px;color:var(--ink-soft);font-family:var(--serif);letter-spacing:.01em}
  @media (max-width:640px){
    .inner{padding:40px 24px}
    .headline{font-size:30px}
    .acts{flex-direction:column}
    .act{padding:0;margin-top:22px}
    .act + .act{border-left:none;border-top:1px solid var(--hairline);padding-top:22px}
    .act:first-child{margin-top:0}
  }
</style>
</head>
<body>
  <div class="band top">
    <div class="inner">
      <div class="daydate">2026年8月6日　木曜日</div>
      <h1 class="headline">きょうは、ほとんどがあなたの時間です、しゅうへい。</h1>
      <div class="drawing">
        <svg viewBox="0 0 840 170" role="img" aria-label="きょうの一日を描いた地形図" xmlns="http://www.w3.org/2000/svg">
          <path d="M0,112 C140,107 280,110 420,108 C560,106 700,109 840,108"
                fill="none" stroke="#2E2C27" stroke-width="2" stroke-linecap="round"/>
          <g stroke="#C6613F" stroke-width="1.6" stroke-linecap="round" fill="none">
            <circle cx="726" cy="54" r="13"/>
            <line x1="726" y1="30" x2="726" y2="22"/>
            <line x1="726" y1="86" x2="726" y2="78"/>
            <line x1="702" y1="54" x2="694" y2="54"/>
            <line x1="758" y1="54" x2="750" y2="54"/>
            <line x1="709" y1="37" x2="703" y2="31"/>
            <line x1="743" y1="37" x2="749" y2="31"/>
            <line x1="709" y1="71" x2="703" y2="77"/>
            <line x1="743" y1="71" x2="749" y2="77"/>
          </g>
          <g stroke="#B4B3A8" stroke-width="1.5" stroke-linecap="round" fill="none">
            <path d="M292,50 q9,-8 18,0"/>
            <path d="M312,44 q9,-8 18,0"/>
          </g>
          <circle cx="176" cy="109.4" r="8" fill="#2E2C27"/>
          <circle cx="452" cy="107.8" r="7" fill="#2E2C27"/>
          <circle cx="560" cy="107.2" r="7" fill="#2E2C27"/>
        </svg>
      </div>
      <div class="acts">
        <div class="act">
          <div class="time">9:00 – 12:00</div>
          <div class="desc">午前は生鮮食材の配達。青菜が、正午までに届きます。</div>
        </div>
        <div class="act">
          <div class="time">14:00 – 17:00</div>
          <div class="desc">2時に土の回収、4時に定期便の配達。午後は受け取りが続きます。</div>
        </div>
        <div class="act">
          <div class="time">17:00 以降</div>
          <div class="desc">予定は入っていません。あたためてきたことに向けられる時間です。</div>
        </div>
      </div>
    </div>
  </div>
  <div class="band bottom">
    <div class="inner">
      <div class="calm">けさ、あなたの手を必要とするものはありません。</div>
    </div>
  </div>
</body>
</html>
