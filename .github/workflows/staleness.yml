name: Staleness watchdog

# 配信の死活監視（PLAN-MB-009 P5 / G2 MUST-2・R02 反映）。
#
# SLI を 2 本持つ。**公開実体（Pages が実際に配信しているバイト列）を一次とする。**
#   SLI-1 配信鮮度  : repo の index.html への **`brief: ` で始まる最終 commit** が閾値より古い
#                     → 中継の停止・トリガ消失・PAT 失効・生成（Cowork）の停止 を検知
#   SLI-2 配信一致  : 公開 URL が返すバイト列の git blob sha が repo HEAD の index.html と一致しない
#                     → **push は成功したが CI が発火せず deploy されていない**（実在の経路）
#                        deploy job の失敗・Pages 障害・CDN の取り残しも同時に覆う
#
#   SLI-3 通知一致  : notify-state.json の ymd が最新ブリーフの日付と一致し、ok=true / degraded=false
#   SLI-5 タイムライン: tlx ブロックが index.html に在り、埋め込み JSON が契約どおり（MB-029）
#   SLI-6 LINE 縮退  : notify-state.json の reason が空でない／format が flex でない（MB-040）
#                     → Flex カードが text へ落ちた日を **fail** で知らせる（MB-025 の warning 行は
#                        job を緑のままにしていたので、8/25 の subset-miss は誰にも届かなかった）
#   SLI-5 タイムライン: tlx ブロックが index.html に在り、埋め込み JSON が妥当（MB-029）
#                     → LINE 通知の停止・トークン失効・link-only への恒常 degrade を検知（MB-014）
#
# SLI-1 だけでは SLI-2 の事象を構造的に検知できない（commit は新しいまま Pages だけ古くなるため）。
# 失敗すると GitHub から Actions 失敗通知メールが repo owner に届く。
# deploy を巻き込まないよう pages.yml とは別 workflow にしている。
#
# 既知の限界（正直開示）: scheduled workflow は「60 日間 commit が無い」と自動的に無効化される。

on:
  schedule:
    - cron: '0 4 * * *'      # 04:00 UTC = 13:00 JST
    # 閾値 26h の根拠（G3 M3）: 判定時刻が 13:00 固定なので、前回公開が t 時なら翌 13:00 の age は (37 - t) 時間。
    #   健全（当日公開済み）の age は最大でも約 13h。
    #   1 日欠測したときの age は最小で 28.6h（前回公開が 08:27 の場合）。
    #   → 閾値は 13h と 28.6h の間である必要がある。30h では 08:21 以降に公開された翌日の欠測を取り逃がす。
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'index.html がこの時間を超えて更新されていなければ失敗させる（既定 26）'
        required: false
        default: '26'

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # index.html の最終コミット日時を読むために履歴が要る

      - name: SLI-1 / SLI-2
        shell: bash
        run: |
          set -uo pipefail
          MAX_AGE_HOURS="${{ github.event.inputs.max_age_hours || '26' }}"
          # 手動 dispatch で閾値を既定から変えた実行は「検知力の確認テスト」であって実障害ではない。
          # 同じ文面で通知すると受信側が区別できないため、明示的にラベルを付ける。
          TAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$MAX_AGE_HOURS" != "26" ]; then
            TAG="【テスト実行・実障害ではない】"
            echo "::notice::${TAG} 閾値を既定 26h ではなく ${MAX_AGE_HOURS}h に上書きして実行している（検知力の確認）。"
          fi
          PAGES_URL="https://1000says.github.io/morning-brief-e149854be5/"
          fail=0

          # ---------- SLI-1: repo 上の配信物の鮮度 ----------
          # !!! commit メッセージで **実ブリーフの publish に限定**する。
          #     単に `-- index.html` の最終 commit を見ると、doc 修正や検証用の commit が
          #     鮮度の時計をリセットし、**最大 26 時間 watchdog を盲目にする**。
          #     2026-08-11 に実発生: D8 検証用の test commit が、30.7h 前の実ブリーフを 9.6h に見せていた。
          #     接頭辞 `brief: ` は中継の commitMessage_ が付ける（relay/src/コード.js）。
          #     生産側と消費側の一致は relay/test/invariants.test.js の INV-C9 が突合する。
          last_iso=$(git log -1 --format=%cI --grep='^brief: ' -- index.html)
          if [ -z "$last_iso" ]; then
            echo "::error::index.html に 'brief: ' で始まる commit が 1 件も無い。中継が一度も publish していないか、接頭辞が変わった可能性がある（fail-closed）。"; exit 1
          fi
          # 実ブリーフより新しい commit（人手/検証由来）があるなら、サマリに注記する。
          # これを黙っていると、受信側は「なぜこの時刻が基準なのか」を追えない。
          newest_iso=$(git log -1 --format=%cI -- index.html)
          # 分で計算する。時間の整数除算にすると実効閾値が +1h ずれる（30 指定で 31h まで PASS）。
          age_min=$(( ( $(date -u +%s) - $(date -u -d "$last_iso" +%s) ) / 60 ))
          max_min=$(( MAX_AGE_HOURS * 60 ))
          age_h=$(( age_min / 60 ))
          echo "SLI-1 last commit=$last_iso age=${age_min}min threshold=${max_min}min"

          {
            echo "### モーニングブリーフ 配信監視"
            echo ""
            echo "| SLI | 観測 | 判定 |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$age_min" -gt "$max_min" ]; then
            echo "::error::${TAG}SLI-1 STALE: 実ブリーフの publish が ${age_h} 時間無い（閾値 ${MAX_AGE_HOURS}h）。中継（Apps Script）または生成（Cowork）が停止している可能性が高い。"
            echo "| 配信鮮度 | 最終更新 \`$last_iso\`（${age_h}h 経過） | 🔴 STALE |" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          else
            echo "| 配信鮮度 | 最終ブリーフ \`$last_iso\`（${age_h}h 経過） | 🟢 fresh |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$newest_iso" != "$last_iso" ]; then
            echo "::notice::index.html に実ブリーフより新しい commit がある（$newest_iso）。鮮度は実ブリーフ基準で判定している。"
            echo "| ※ | index.html の最新 commit \`$newest_iso\` はブリーフ以外 | ℹ️ |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # ---------- SLI-2: 公開実体が repo HEAD と一致するか ----------
          # curl は 3 回まで再試行する（CDN の一時エラーで偽陽性を出さないため）
          http=$(curl -sS -o live.html -w '%{http_code}' --retry 3 --retry-delay 5 --max-time 30 "$PAGES_URL" || echo 000)
          if [ "$http" != "200" ]; then
            echo "::error::${TAG}SLI-2 公開 URL が HTTP $http を返した（期待 200）。Pages が配信できていない。"
            echo "| 配信一致 | 公開 URL が HTTP \`$http\` | 🔴 DOWN |" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          else
            repo_sha=$(git hash-object index.html)
            live_sha=$(git hash-object live.html)
            echo "SLI-2 repo=$repo_sha live=$live_sha"
            if [ "$repo_sha" != "$live_sha" ]; then
              echo "::error::${TAG}SLI-2 MISMATCH: repo の index.html ($repo_sha) と公開中のバイト列 ($live_sha) が一致しない。push は成功したが deploy されていない可能性が高い（CI 未発火・deploy 失敗・CDN 取り残し）。"
              echo "| 配信一致 | repo \`${repo_sha:0:12}\` ≠ live \`${live_sha:0:12}\` | 🔴 NOT DEPLOYED |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            else
              echo "| 配信一致 | repo = live \`${repo_sha:0:12}\` | 🟢 deployed |" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi


          # ---------- SLI-3: 通知一致（MB-014） ----------
          # !!! .ymd だけを見ないこと。失敗時も ymd を書くなら、トークン失効で 1 通も届かない日も
          #     一致して PASS する。**機能が死ぬときこそ否定ゲートは確実に緑になる**（CE-04b ⑫）。
          if [ ! -f notify-state.json ]; then
            # **無音にしない。** 行が出ないと「SLI-3 が存在しない」のか「未導入」のかを受信側が区別できない。
            echo "| 通知一致 | notify-state.json 未導入（MB-014 未有効化） | ⚪ 未導入 |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f notify-state.json ]; then
            n_ymd=$(jq -r '.ymd // empty' notify-state.json)
            n_ok=$(jq -r '.ok // false' notify-state.json)
            n_deg=$(jq -r '.degraded // false' notify-state.json)
            n_en=$(jq -r '.enabled // false' notify-state.json)
            b_ymd=$(git log -1 --format=%s --grep='^brief: ' -- index.html | sed -n 's/^brief: \([0-9-]\{10\}\).*/\1/p')
            echo "SLI-3 notify ymd=$n_ymd ok=$n_ok degraded=$n_deg enabled=$n_en / brief ymd=$b_ymd"

            # 停止中は skip する。ただし **永久 skip にしない** ——
            # enabled を書く主体が壊れたら誰も気づけなくなるため、3 日以上古ければ WARN を出す。
            if [ "$n_en" != "true" ]; then
              stale_days=99
              if [ -n "$n_ymd" ]; then
                stale_days=$(( ( $(date -u +%s) - $(date -u -d "$n_ymd" +%s) ) / 86400 ))
              fi
              if [ "$stale_days" -ge 3 ]; then
                echo "::warning::${TAG}SLI-3 通知は無効（enabled=false）だが、状態が ${stale_days} 日更新されていない。中継が state を書けていない可能性がある。"
                echo "| 通知一致 | 無効・状態が ${stale_days} 日古い | 🟡 要確認 |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "| 通知一致 | 無効（enabled=false） | ⚪ skip |" >> "$GITHUB_STEP_SUMMARY"
              fi
            elif [ -z "$b_ymd" ]; then
              echo "::error::${TAG}SLI-3 index.html に 'brief: ' commit が無く突合できない。"
              echo "| 通知一致 | brief commit 不在 | 🔴 |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            elif [ "$n_ymd" != "$b_ymd" ]; then
              echo "::error::${TAG}SLI-3 MISMATCH: 最新ブリーフは $b_ymd だが通知は $n_ymd までしか出ていない。LINE 配信が止まっている。"
              echo "| 通知一致 | brief \`$b_ymd\` / notify \`$n_ymd\` | 🔴 STALE |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            elif [ "$n_ok" != "true" ]; then
              echo "::error::${TAG}SLI-3 送信が失敗している（ok=false）。トークン失効・ブロック等を疑う。"
              echo "| 通知一致 | 送信失敗（ok=false） | 🔴 |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            elif [ "$n_deg" = "true" ]; then
              # degrade は「異常だが配信は続く」。FAIL にはしないが**無音にはしない**。
              echo "::warning::${TAG}SLI-3 通知が link-only へ degrade している（本文を載せられていない）。"
              echo "| 通知一致 | link-only へ degrade | 🟡 |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| 通知一致 | \`$n_ymd\` 送信済 | 🟢 ok |" >> "$GITHUB_STEP_SUMMARY"
            fi
            # ---- MB-025: LINE 形式の生存行（warning-only・判定式は上のまま）----
            # flex が text へ縮退しても通知自体は成功なので上の判定は緑のまま。**縮退を無音にしない**ため
            # format と reason を 1 行で出す（fail は立てない・G2 MUST-4）。format が無い＝MB-025 未配備。
            n_fmt=$(jq -r '.format // empty' notify-state.json)
            n_rsn=$(jq -r '.reason // empty' notify-state.json)
            if [ -z "$n_fmt" ]; then
              echo "| LINE 形式 | （format 未記録＝MB-025 未配備） | ⚪ |" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$n_fmt" = "text" ] && [ -n "$n_rsn" ]; then
              echo "::warning::${TAG}LINE カードが text へ縮退している（reason=$n_rsn）。history.json の形式・同期・guard を疑う。"
              echo "| LINE 形式 | text（$n_rsn） | 🟡 flex 縮退 |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| LINE 形式 | $n_fmt | 🟢 |" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          # ---------- SLI-4: 参照ソースの網羅（MB-023） ----------
          # 生成側の拡張（12 カレンダー参照）が効いているかは**こちら側からは確認できない**
          # ——実効は Cowork のタスク文にのみ宿り、上書き・切り詰め・スキル側の無視はすべて無音で起きる。
          # 生成側契約（INTEGRATION-SPEC §5.5）で <meta name="brief-sources"> を必須にし、ここで検査する。
          #   cal = 対象カレンダー数（allowlist の固定値）
          #   ok  = 実際に応答が返った数（**cal だけでは 11 件失敗しても正常に見える**ため必須）
          # **無音にしない**: マーカーが無い場合も行を出す（未導入と正常を受信側が区別できるように）。
          EXPECT_CAL="${EXPECT_CAL:-12}"
          # タグ全体を取ってから content を抜く（**属性順に依存しない**。
          # `content=` が先に来る書き方で検出できず「未導入」と誤判定するのを防ぐ＝実測で修正）。
          # !!! `|| true` が要る。GitHub Actions の既定シェルは **`-e` 付き**（`bash --noprofile --norc -e -o pipefail`）で、
          #     staleness.yml 自身の `set -uo pipefail` には `-e` が無いため手元では再現しない。
          #     grep は **no-match で exit 1** を返すので、マーカー不在（＝移行期の正常状態）で
          #     この代入がジョブごと落とす。**実測 2026-08-17: run 31997349481 が SLI-4 の出力を 1 行も出さずに
          #     exit 1**（SLI-1/2/3 は緑だったのに summary も出ない＝WARN で済ませる設計が成立していなかった）。
          sli4_tag="$(grep -o '<meta[^>]*brief-sources[^>]*>' index.html | head -1 || true)"
          marker="$(printf '%s' "$sli4_tag" | sed -n 's/.*content="\([^"]*\)".*/\1/p')"
          # 単一引用符の書き方も拾う。二重引用符だけを見ると content='...' を「マーカー無し」と
          # 誤判定する（属性順の偽陰性と同型＝D46「同じ欠陥形が当たる隣を塞ぐ」）。
          if [ -z "$marker" ]; then
            marker="$(printf '%s' "$sli4_tag" | sed -n "s/.*content='\([^']*\)'.*/\1/p")"
          fi
          if [ -z "$marker" ]; then
            # 2026-08-18: 移行完了（公開ページに marker 実在を実測）につき WARN -> FAIL へ昇格。
            # WARN のままだと「生成側が MB-023 を失った」状態が緑で通り続ける＝
            # 12 カレンダー化も redaction 契約も消えたのに誰も気づかない（最も危険な沈黙）。
            echo "::error::${TAG}SLI-4 brief-sources マーカーが無い。生成側の指示文が上書き・切り詰められ、MB-023 の redaction 契約ごと失われた疑いがある。"
            echo "| 参照ソース | マーカー無し | 🔴 指示が失われた疑い |" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          else
            m_cal="$(echo "$marker" | sed -n 's/.*cal=\([0-9]\{1,\}\).*/\1/p')"
            m_ok="$(echo "$marker" | sed -n 's/.*ok=\([0-9]\{1,\}\).*/\1/p')"
            m_ev="$(echo "$marker" | sed -n 's/.*ev=\([0-9]\{1,\}\).*/\1/p')"
            echo "SLI-4 marker='$marker' cal=$m_cal ok=$m_ok ev=$m_ev expect_cal=$EXPECT_CAL"
            if [ -z "$m_cal" ] || [ -z "$m_ok" ]; then
              echo "::error::${TAG}SLI-4 マーカーの形式が不正（cal と ok の整数が読めない）: '$marker'"
              echo "| 参照ソース | 形式不正 \`$marker\` | 🔴 |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            elif printf '%s' "$marker" | grep -q 'ev=' && [ -z "$m_ev" ]; then
              # `ev=N` のようにテンプレートの literal が残っている＝生成側が指示どおり数えていない。
              # 放置すると「マーカーはあるが中身が偽」という最も気づきにくい状態になる。
              echo "::error::${TAG}SLI-4 ev が整数でない（テンプレートの literal が残っている）: '$marker'"
              echo "| 参照ソース | ev が非整数 \`$marker\` | 🔴 |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            elif [ "$m_cal" -lt "$EXPECT_CAL" ]; then
              echo "::error::${TAG}SLI-4 参照カレンダーが減った（cal=$m_cal < 期待 $EXPECT_CAL）。生成側の指示が上書き・切り詰められた可能性が高い。"
              echo "| 参照ソース | cal=$m_cal（期待 $EXPECT_CAL） | 🔴 縮小 |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            elif [ "$m_cal" -gt "$EXPECT_CAL" ]; then
              # **増加は縮小より危険**。縮小＝欠測（可逆）だが、増加＝無審査のカレンダーが
              # Public へ流れた（不可逆）。従来は -lt しか見ておらず、
              # 「可逆な失敗は hard FAIL・不可逆な失敗は素通り」という逆立ちした計器だった。
              echo "::error::${TAG}SLI-4 参照カレンダーが増えた（cal=$m_cal > 期待 $EXPECT_CAL）。allowlist に無いカレンダーが公開対象に入った可能性がある＝露出は不可逆。"
              echo "| 参照ソース | cal=$m_cal（期待 $EXPECT_CAL） | 🔴 **拡大** |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            elif [ "$m_ok" -lt "$m_cal" ]; then
              # 部分失敗は「配信は続くが取りこぼしている」。FAIL にはしないが**無音にはしない**。
              echo "::warning::${TAG}SLI-4 部分失敗: $m_cal 件中 $m_ok 件しか取得できていない（権限・ID 失効・タイムアウトを疑う）。"
              echo "| 参照ソース | ok=$m_ok / cal=$m_cal・ev=${m_ev:-?} | 🟡 部分失敗 |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| 参照ソース | cal=$m_cal ok=$m_ok ev=${m_ev:-?} | 🟢 ok |" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          # ---------- SLI-5: きょうのタイムライン（MB-029） ----------
          # 生成側はテンプレートを**毎朝作り直す**ため、貼り込んだブロックは静かに落ちる／壊れる。
          # 判定は .github/scripts/tlx-check.py（ローカルでも同じコマンドで再現できる）。
          # データ側（ブロック不在・JSON 破損・日付ずれ）は移行期の方針どおり WARN 止まり＝
          # **無音にはしない**（未導入と故障を受信側が区別できるように）。
          # **SLI-6 と同じ形に揃える**（MB-040 G3 MUST-3・2026-08-25）: 判定器の「不在」と
          #   「動かない」を分ける。SLI-5 も同じ穴を踏んでいた——判定器は SLI-6 と**同じ 1 回の
          #   push で配備される**ため、片方だけ fail-closed にすると「配備し忘れ」の検知が
          #   ゲートによってまちまちになる。不在＝赤（ゲートが存在しない）／実行不能＝黄。
          #   データ側の契約違反は従来どおり warn（移行期の方針は据え置き）。
          if [ ! -f .github/scripts/tlx-check.py ]; then
            tlx_out="ABSENT"
          else
            tlx_out="$(python3 .github/scripts/tlx-check.py index.html 2>/dev/null || echo "BAD runner")"
          fi
          echo "SLI-5 $tlx_out"
          case "$tlx_out" in
            ABSENT)
              echo "::error::${TAG}SLI-5 判定器が配備されていない（.github/scripts/tlx-check.py が repo に無い）。ラベル allowlist を強制できる決定論ゲートはここだけで、不在の間は生名・calendarId が公開面へ出ても検知できない。site/.github/scripts/ 一式を配信 repo へ push する。"
              echo "| タイムライン | 判定器 **未配備** | 🔴 ゲート不在 |" >> "$GITHUB_STEP_SUMMARY"
              fail=1 ;;
            "BAD runner")
              echo "::warning::${TAG}SLI-5 判定器は在るが実行できない（python3 不在・クラッシュを疑う）。"
              echo "| タイムライン | 判定器 実行不能 | 🟡 |" >> "$GITHUB_STEP_SUMMARY" ;;
            MISSING*)
              echo "::warning::${TAG}SLI-5 タイムラインのブロックが無い（tlx-canvas 不在）。生成側の指示文から落ちた疑い。"
              echo "| タイムライン | ブロック不在 | 🟡 未導入/欠落 |" >> "$GITHUB_STEP_SUMMARY" ;;
            NOJSON*)
              echo "::warning::${TAG}SLI-5 ブロックはあるがデータ JSON が無い（何も描画されない）。"
              echo "| タイムライン | JSON 不在 | 🟡 |" >> "$GITHUB_STEP_SUMMARY" ;;
            BAD*)
              # cal-label 系は「非表示になる」ではない（ブロックは c を無検証で描画する）。受信側が症状を取り違えないよう分けて書く（MB-036 G3 MUST-1・2026-08-25）。
              echo "::warning::${TAG}SLI-5 タイムラインのデータが契約違反（$tlx_out）。json/date/time 系ならブロックは自動的に非表示。cal-label / allday-cal-label は非表示にならず、allowlist 外のラベル（生のカレンダー名・calendarId・実名）が公開面に描画されている疑い＝生成側タスク本文のラベル表12行を確認する（写しは docs/handoff/cowork/COWORK-TASK-NEXT.md）。"
              echo "| タイムライン | データ不正（${tlx_out#BAD }） | 🟡 |" >> "$GITHUB_STEP_SUMMARY" ;;
            OK*)
              t_date="$(echo "$tlx_out" | cut -d' ' -f2)"
              t_ev="$(echo "$tlx_out" | cut -d' ' -f3)"
              t_ad="$(echo "$tlx_out" | cut -d' ' -f4)"
              if [ -n "${b_ymd:-}" ] && [ "$t_date" != "$b_ymd" ]; then
                echo "::warning::${TAG}SLI-5 タイムラインの日付 $t_date がブリーフ日 $b_ymd と一致しない（前日分が残った疑い）。"
                echo "| タイムライン | 日付ずれ $t_date≠$b_ymd | 🟡 |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "| タイムライン | $t_date・予定 $t_ev 件／終日 $t_ad 件 | 🟢 ok |" >> "$GITHUB_STEP_SUMMARY"
              fi ;;
            *)
              echo "::warning::${TAG}SLI-5 判定不能（出力: $tlx_out）。"
              echo "| タイムライン | 判定不能 | 🟡 |" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

          # ---------- SLI-6: LINE 縮退の**判定**（MB-040） ----------
          # 上の「LINE 形式」行（MB-025）は `::warning::` 止まりで **job は緑のまま**だった。
          # 2026-08-25 の `subset-miss` はそのため誰にも届かなかった——中継は理由を
          # notify-state.json へ正直に書いて push しているのに、読む人も鳴らす経路も無い
          # （記録はあるが検出チャネルが死んでいる＝CE-04 gate liveness）。ここで fail へ昇格する。
          # 判定は .github/scripts/notify-degradation-check.py（workflow に条件式を置かない＝
          # ローカルでも同じコマンドで再現でき、relay/test/notify-degradation.test.js が検査できる）。
          # **判定器の「不在」と「動かない」を先に分ける**（MB-040 G3 MUST-3・2026-08-25）。
          #   初版は両方を "BAD runner" に潰して warning 止まりにしていたため、
          #   **配備し忘れると永久に緑**（＝ゲートが存在しないのに毎日 🟡 が出るだけ）になった。
          #   実測: 配信 repo に .github/scripts/ が無く、SLI-4/5/6 のいずれも remote に存在しない。
          #   不在＝**このゲートは存在しない**＝赤／在るのに落ちる＝環境要因なので黄（fail-open）。
          if [ ! -f .github/scripts/notify-degradation-check.py ]; then
            nd_out="ABSENT"
          else
            nd_out="$(python3 .github/scripts/notify-degradation-check.py notify-state.json 2>/dev/null || echo 'BAD runner')"
          fi
          echo "SLI-6 $nd_out"
          case "$nd_out" in
            ABSENT)
              echo "::error::${TAG}SLI-6 判定器が配備されていない（.github/scripts/notify-degradation-check.py が repo に無い）。SLI-6 は存在しないのと同じ＝縮退が起きても誰も気づけない。site/.github/scripts/ 一式を配信 repo へ push する。"
              echo "| LINE 縮退 | 判定器 **未配備** | 🔴 ゲート不在 |" >> "$GITHUB_STEP_SUMMARY"
              fail=1 ;;
            MISSING)
              # **無音にしない**（未導入と故障を受信側が区別できるように）
              echo "| LINE 縮退 | notify-state.json 未導入 | ⚪ |" >> "$GITHUB_STEP_SUMMARY" ;;
            "SKIP "*)
              echo "| LINE 縮退 | 判定対象外（${nd_out#SKIP }） | ⚪ skip |" >> "$GITHUB_STEP_SUMMARY" ;;
            "OK "*)
              echo "| LINE 縮退 | ${nd_out#OK } で配信 | 🟢 ok |" >> "$GITHUB_STEP_SUMMARY" ;;
            "NG "*)
              echo "::error::${TAG}SLI-6 LINE 通知が縮退している（${nd_out#NG }）。history.json の文字列が当日の公開本文へ verbatim で含まれているかを確認する（生成側の contract＝decisions D59・手順は COWORK-TASK-NEXT.md の『verbatim 自己検査』）。ローカル再現: python -X utf8 scripts/check_notify_degradation.py"
              echo "| LINE 縮退 | ${nd_out#NG } | 🔴 縮退 |" >> "$GITHUB_STEP_SUMMARY"
              fail=1 ;;
            "BAD runner")
              # 判定器は**在るのに動かない**＝python3 不在・クラッシュ等の環境要因。
              # ここは fail-open（毎日赤くしない）。**不在（ABSENT）とは別事象**として扱う。
              echo "::warning::${TAG}SLI-6 判定器は在るが実行できない（python3 不在・クラッシュを疑う）。"
              echo "| LINE 縮退 | 判定器 実行不能 | 🟡 |" >> "$GITHUB_STEP_SUMMARY" ;;
            "BAD "*)
              # state が読めない＝**判定できない**。ここは fail-closed にする（state を書く主体が壊れた日と
              # 正常な日を区別できなくなるため。判定器の不在〔上〕とは別事象）。
              echo "::error::${TAG}SLI-6 notify-state.json が読めない（${nd_out#BAD }）。中継の state 書き込みが壊れた疑い。"
              echo "| LINE 縮退 | state 破損（${nd_out#BAD }） | 🔴 |" >> "$GITHUB_STEP_SUMMARY"
              fail=1 ;;
            *)
              # 契約外の出力＝判定器と workflow の版がずれている。緑にしない。
              echo "::error::${TAG}SLI-6 判定不能（出力: $nd_out）。判定器と workflow の契約がずれている。"
              echo "| LINE 縮退 | 判定不能（$nd_out） | 🔴 |" >> "$GITHUB_STEP_SUMMARY"
              fail=1 ;;
          esac

          if [ "$fail" = "1" ]; then
            {
              echo ""
              echo "**調査手順**: Apps Script プロジェクト \`Github_PAT\` の Web App \`?op=status\` で"
              echo "\`lastTriggerAt\`（無人発火の証拠）・\`lastResult\`・\`generations\` を確認する。"
              echo "\`lastTriggerAt\` が 2 時間以上進んでいなければ、トリガが停止／自動無効化された疑い。"
              echo ""
              echo "SLI-4 が鳴った場合は **claude.ai の定期タスク本文**を確認する"
              echo "（実効 SoT はそこにしかない。リポジトリ側の COWORK-PROMPT.md は stale＝D49）。"
              echo "稼働値の写しは docs/handoff/cowork/COWORK-TASK-LIVE.md、貼り替え用は COWORK-TASK-NEXT.md。"
              echo "**読み戻しは必ず別会話で行う**（同一会話の自己申告は証拠にならない＝D50）。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "🟢 すべて正常" >> "$GITHUB_STEP_SUMMARY"
