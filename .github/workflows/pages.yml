name: Deploy page

# main への push（中継の毎朝の上書き含む）で privacy-guard→deploy を実行する。
# privacy-guard が index.html に禁止パターンを検出したら deploy をブロックする（fail-closed）。
# 注意: これは「描画時のベストエフォート衛生＋更新停止アラート」であり、Public リポジトリでは
# push 時点で blob が公開される（露出そのものは防げない）。内容の redaction は生成側で担保すること。
#
# guard の実体は .github/guard.js（node）。**relay/src/コード.js の guardPatterns_() と文字列として同一**に
# 保つこと（CE-05）。パターンに後読み/先読みを使うため POSIX ERE（grep -E）では表現できず、
# エンジンを揃えて構造的に一致させている。差分は relay/test/invariants.test.js の INV-C1/C2/C3 が検知する。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress: true（D109・2026-10-03）: 2026-09-30 に deploy が environment `github-pages` の
# `waiting` で 46 時間張り付き、false だと後続が全部詰まって 2 日公開が止まった。environment 待ちには
# timeout-minutes が効かない（待ちの上限は GitHub 固定の 30 日）ため、上限は「次の push が取り消す」で置く。
# 毎朝 brief/notify の push があるので張り付きは最長約 24h で自己回復する。配備するのは常に main の最新なので、
# 途中の配備を取り消しても最終状態は変わらない。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan index.html for forbidden personal identifiers
        shell: bash
        run: |
          set -euo pipefail
          node --version
          # guard.js は起動時に自己テスト（一時ファイル経由の実 I/O）を行い、
          # 自身が壊れている場合は走査せずに exit 1 する（guard の死を素通りさせない）。
          node .github/guard.js index.html

  deploy:
    needs: privacy-guard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # 過去分（archive/）を index.html の履歴から作るため（MB-117）
      - name: Stage index.html, shared assets and the archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          # 共通部品（MB-117・DEC-2026-10-12-brief-archive）。頁は無くても読める＝付随物。
          if [ -d assets ]; then mkdir -p _site/assets && { cp assets/brief.css assets/brief.js _site/assets/ || echo "::warning::assets copy failed"; }; fi
          # 過去分: 直近 14 日の頁と一覧。各頁と一覧に guard.js を掛け、落ちた頁は載せない（build-archive.py の中）。
          # 失敗しても index.html の配備は止めない（付随機能）。無いことは staleness の SLI-8 が赤にする。
          python3 .github/scripts/build-archive.py _site || echo "::warning::build-archive failed (archive is not published this time)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
